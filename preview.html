<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InfinityWord — theme preview</title>

<!-- Stand-in for the layout rules that already live in your index.html <style>.
     In your real page you do NOT need this block — just add theme.css after your own styles. -->
<style>
:root{--bg:#0a0c10;--surface:#111318;--surface2:#181c24;--border:#232730;--accent:#4f8ef7;--accent2:#7c3aed;--text:#e8eaf0;--muted:#6b7280;--muted2:#9ca3af;--green:#22c55e;--orange:#f97316;--red:#ef4444;--yellow:#eab308}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.logo-title{font-size:18px;font-weight:800}.logo-sub{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-section-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted2);margin-bottom:2px;border:1px solid transparent}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--surface2);padding:2px 7px;border-radius:20px;color:var(--muted)}
.dept-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;min-height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
.topbar-title{font-size:17px;font-weight:700}.topbar-subtitle{font-size:12px;color:var(--muted)}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 14px 9px 38px;color:var(--text);font-size:13px;outline:none}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.topbar-actions{display:flex;gap:8px;margin-left:auto}
.filterbar{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--muted2);background:var(--surface2)}
.filter-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
select.filter-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;outline:none}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.stat-value{font-size:28px;font-weight:800;margin-top:4px}.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
.q-card:hover::before{opacity:1}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-course{font-size:14px;font-weight:600;line-height:1.3;flex:1}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.badge-mid{background:rgba(234,179,8,.15);color:var(--yellow)}.badge-final{background:rgba(239,68,68,.15);color:var(--red)}
.badge-quiz{background:rgba(34,197,94,.15);color:var(--green)}.badge-lab{background:rgba(249,115,22,.15);color:var(--orange)}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.meta-tag{font-size:11px;color:var(--muted)}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.card-dept-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px}
.btn-view{font-size:12px;padding:5px 14px;border-radius:7px;background:rgba(79,142,247,.15);color:var(--accent);border:1px solid rgba(79,142,247,.3);cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:800px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-title{font-size:17px;font-weight:700;flex:1}.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn-close{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px}
.modal-body{flex:1;overflow-y:auto}
.pdf-frame-wrap{position:relative;width:100%;height:260px;background:#000}
.pdf-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-panel{padding:20px 24px;border-top:1px solid var(--border)}.ai-panel-title{font-size:13px;font-weight:600;color:var(--muted2);margin-bottom:10px}
.ai-question-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none;min-height:70px;font-family:inherit}
@media(max-width:768px){.sidebar{width:0;min-width:0}.stats-row{grid-template-columns:repeat(2,1fr)}.cards-grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-title">🎓 DIU QBank</div><div class="logo-sub">Smart Study Portal</div></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><div class="topbar-title" id="topbarTitle">All Questions</div><div class="topbar-subtitle" id="topbarSub">Browse all departments</div></div>
      <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" type="text" placeholder="Search…"/></div>
      <div class="topbar-actions"><button class="btn-view">Login</button><button class="btn-view">Settings</button></div>
    </div>
    <div class="filterbar" id="filterbar">
      <span class="filter-label">Type:</span>
      <span class="filter-chip active" data-t="">All</span>
      <span class="filter-chip" data-t="Mid">📝 Mid</span>
      <span class="filter-chip" data-t="Final">📋 Final</span>
      <span class="filter-chip" data-t="Quiz">❓ Quiz</span>
      <span class="filter-chip" data-t="Lab Final">🧪 Lab Final</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px"><span class="filter-label">Semester:</span>
        <select class="filter-select" id="semFilter"><option value="">All Semesters</option></select></span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal">
    <div class="modal-header"><div style="flex:1"><div class="modal-title" id="modalTitle"></div><div class="modal-meta" id="modalMeta"></div></div><button class="btn-close" id="closeBtn">✕</button></div>
    <div class="modal-body">
      <div class="pdf-frame-wrap"><div class="pdf-loading"><div class="spinner"></div><span>Loading question paper…</span></div></div>
      <div class="ai-panel"><div class="ai-panel-title">🤖 AI Question Solver</div>
        <textarea class="ai-question-input" placeholder="Paste a question from this paper…"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="btn-primary">✨ Solve with AI</button><button class="btn-view">📚 Key Topics</button></div></div>
    </div>
  </div>
</div>

<!-- Sample rows in the SAME shape as your real QRAW: [id, dept, dept_full, course, sem, type, url] -->
<script>
const QRAW=[[2,"CSE","Computer Science & Engineering","Data Structures","Fall 23","Final",""],[6,"CSE","Computer Science & Engineering","Programming and Problem Solving","Spring 24","Mid",""],[10,"EEE","Electrical & Electronic Engineering","Electrical Circuits II","Fall 23","Final",""],[34,"CSE","Computer Science & Engineering","Algorithms","Spring 24","Final",""],[59,"CSE","Computer Science & Engineering","Database management System","Spring 23","Final",""],[63,"CSE","Computer Science & Engineering","Artificial Intelligence","Fall 23","Final",""],[88,"CSE","Computer Science & Engineering","Data Structures","Fall 24","Quiz",""],[93,"ITM","ITM","Management Information System","Spring 24","Mid",""],[103,"ITM","ITM","Software and Web security","Fall 23","Mid",""],[135,"SWE","Software Engineering","Algorithm Design and Analysis","Spring 24","Final",""],[154,"CE","Civil Engineering","Water supply Engineering","Fall 24","Mid",""],[200,"CSE","Computer Science & Engineering","Mathematics II","Fall 24","Lab Final",""],[229,"SWE","Software Engineering","Algorithm Design and Analysis","Fall 24","Lab Final",""],[231,"CIS","CIS","Structured Programming","Fall 23","Lab Final",""],[244,"CSE","Computer Science & Engineering","Discrete Mathematics","Spring 25","Quiz",""],[257,"SWE","Software Engineering","Algorithm Design and Analysis","Spring 25","Mid",""],[296,"GEB","GEB","Introductory Animal Science","Spring 25","Mid",""],[307,"EEE","Electrical & Electronic Engineering","Energy Conversion-I","Spring 25","Mid",""],[337,"CSE","Computer Science & Engineering","Compiler Design","Spring 25","Final",""],[380,"GEB","GEB","Basic Plant Science","Spring 25","Final",""],[427,"TE","TE","Fabric Manufacturing l","Spring 25","Final",""],[444,"NFE","NFE","Introduction to food science and technology","Summer 25","Mid",""],[493,"MCT","Multimedia & Creative Technology","Drawing and Sketching","Summer 25","Mid",""],[494,"AGS","Agricultural Science","Fundamentals of Horticulture","Spring 25","Mid","" </script>

<!-- Minimal stand-in for your real page logic (auth, admin, AI solver live in your index.html) -->
<script>
(() => {
  const $ = s => document.querySelector(s);
  let dept = null, type = null, sem = '', q = '';
  const badge = t => ({Mid:'mid',Final:'final',Quiz:'quiz','Lab Final':'lab'})[t];
  const depts = [...new Set(QRAW.map(r => r[1]))].sort();
  const nav = $('#sidebarNav');
  function buildNav() {
    nav.innerHTML = '<div class="nav-section-label">Browse</div>';
    const mk = (label, key, n, cls) => {
      const d = document.createElement('div');
      d.className = 'nav-item' + (dept === key ? ' active' : '');
      d.innerHTML = (cls ? '<span class="dept-dot ' + cls + '"></span>' : '<span>📚</span>') + label + '<span class="count">' + n + '</span>';
      d.onclick = () => { dept = key; $('#topbarTitle').textContent = key || 'All Questions'; buildNav(); render(); };
      nav.appendChild(d);
    };
    mk('All departments', null, QRAW.length);
    depts.forEach(k => mk(k, k, QRAW.filter(r => r[1] === k).length, 'dot-' + k));
  }
  [...new Set(QRAW.map(r => r[4]))].forEach(s => $('#semFilter').insertAdjacentHTML('beforeend', '<option>' + s + '</option>'));
  function render() {
    const rows = QRAW.filter(r => (!dept || r[1] === dept) && (!type || r[5] === type) && (!sem || r[4] === sem) &&
      (!q || (r[3] + ' ' + r[4] + ' ' + r[5]).toLowerCase().includes(q)));
    const c = $('#content');
    c.innerHTML =
      '<div class="stats-row">' +
        '<div class="stat-card"><div class="stat-label">Papers</div><div class="stat-value">' + rows.length + '</div><div class="stat-sub">matching your filters</div></div>' +
        '<div class="stat-card"><div class="stat-label">Courses</div><div class="stat-value">' + new Set(rows.map(r => r[3])).size + '</div><div class="stat-sub">unique subjects</div></div>' +
        '<div class="stat-card"><div class="stat-label">Finals</div><div class="stat-value">' + rows.filter(r => r[5] === 'Final').length + '</div><div class="stat-sub">end-of-term papers</div></div>' +
        '<div class="stat-card"><div class="stat-label">Quizzes</div><div class="stat-value">' + rows.filter(r => r[5] === 'Quiz').length + '</div><div class="stat-sub">short tests</div></div>' +
      '</div><div class="cards-grid">' +
      rows.map(r => '<div class="q-card" data-id="' + r[0] + '"><div class="card-header"><div class="card-course">' + r[3] +
        '</div><span class="badge badge-' + badge(r[5]) + '">' + r[5] + '</span></div><div class="card-meta"><span class="meta-tag">📅 ' + r[4] +
        '</span><span class="meta-tag">🏛 ' + r[2] + '</span></div><div class="card-footer"><span class="card-dept-badge dept-' + r[1] + '">' + r[1] +
        '</span><button class="btn-view">View paper</button></div></div>').join('') + '</div>';
  }
  document.querySelectorAll('.filter-chip').forEach(ch => ch.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
    ch.classList.add('active'); type = ch.dataset.t || null; render();
  }));
  $('#semFilter').onchange = e => { sem = e.target.value; render(); };
  $('#searchInput').oninput = e => { q = e.target.value.toLowerCase(); render(); };
  $('#content').addEventListener('click', e => {
    const card = e.target.closest('.q-card'); if (!card) return;
    const r = QRAW.find(x => x[0] == card.dataset.id);
    $('#modalTitle').textContent = r[3];
    $('#modalMeta').innerHTML = '<span class="badge badge-' + badge(r[5]) + '">' + r[5] + '</span><span class="meta-tag">' + r[4] + '</span>';
    $('#modalOverlay').style.display = 'flex';
  });
  $('#closeBtn').onclick = () => $('#modalOverlay').style.display = 'none';
  buildNav(); render();
})();
</script>

<script src="fx.js"></script>
</body>
</html>
